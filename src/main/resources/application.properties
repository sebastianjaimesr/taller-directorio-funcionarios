spring.application.name=directorio-funcionarios
server.port=8080

# MySQL: la base se crea sola si no existe.
# Usuario y contraseña se pueden cambiar con las variables de entorno DB_USERNAME y DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/directorio_funcionarios?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" crea/ajusta la tabla sin borrar datos al reiniciar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Sesión de inicio de sesión (cookie JSESSIONID)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
